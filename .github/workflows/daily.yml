name: 아침 주식 브리핑

on:
  schedule:
    # 시각은 UTC 기준. KST = UTC + 9시간.
    # 23:00~07:00 UTC = 08:00~16:00 KST → 국내장
    # 13:00~21:00 UTC = 22:00~06:00 KST → 미국장
    # 장중 매시간 갱신. 월 약 400회 × 1분 ≈ 400분 (무료 한도 2,000분)
    - cron: "0 23,0,1,2,3,4,5,6,7 * * 1-5"
    - cron: "0 13,14,15,16,17,18,19,20,21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["portfolio.json", "**.py", ".github/workflows/daily.yml", "transactions.json"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 브리핑 생성
        env:
          # 전부 선택사항. 없으면 해당 기능만 조용히 건너뜁니다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build.py

      - name: dist 커밋 (호스팅이 자동 배포)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist 는 매번 새로 생성되므로 원격 최신 커밋 위에 그대로 얹습니다.
          # (워크플로는 트리거 커밋을 체크아웃하므로 origin/main 보다 뒤일 수 있고,
          #  그 상태로 rebase 하면 생성물끼리 충돌해서 push 가 실패합니다)
          git fetch origin main
          git reset --mixed origin/main
          git add dist
          git diff --staged --quiet && exit 0
          git commit -m "브리핑 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M)"
          git push origin HEAD:main
