name: 아침 주식 브리핑

on:
  schedule:
    # 시각은 UTC 기준. KST = UTC + 9시간.
    # 분을 정각(:00)에서 비켜 :07 로 둡니다. GitHub 예약 실행은 베스트 에포트라
    # 전 세계 크론이 몰리는 정각에는 지연·누락이 특히 심합니다.
    # 23:07~07:07 UTC = 08:07~16:07 KST → 국내장
    - cron: "7 23,0,1,2,3,4,5,6,7 * * 1-5"
    # 13:07~21:07 UTC = 22:07~06:07 KST → 미국장
    - cron: "7 13,14,15,16,17,18,19,20,21 * * 1-5"
    # 국내장 마감(15:30 KST) 3분 전 = 06:27 UTC. 종가 직전 값을 한 번 더 남깁니다.
    - cron: "27 6 * * 1-5"
    # 하루 한 번 고정 기록 (14:50 UTC = 23:50 KST). 주말·공휴일 포함 매일 실행합니다.
    # 그날 KST 기준 마지막 실행이라 일별 변화에 이 시각 값이 남고, 빠지는 날이 없어집니다.
    - cron: "50 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["portfolio.json", "**.py", ".github/workflows/daily.yml", "transactions.json"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 브리핑 생성
        env:
          # 전부 선택사항. 없으면 해당 기능만 조용히 건너뜁니다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build.py

      - name: dist 커밋 (호스팅이 자동 배포)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist 는 매번 새로 생성되므로 원격 최신 커밋 위에 그대로 얹습니다.
          # (워크플로는 트리거 커밋을 체크아웃하므로 origin/main 보다 뒤일 수 있고,
          #  그 상태로 rebase 하면 생성물끼리 충돌해서 push 가 실패합니다)
          git fetch origin main
          git reset --mixed origin/main
          git add dist
          git diff --staged --quiet && exit 0
          git commit -m "브리핑 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M)"
          git push origin HEAD:main
